; =====================================================================
; test.ini - sample input for the INIRW example (example.cpp)
; GENERATED BY CLAUDE - NO AI WAS USED IN THE HEADER ITSELF!
; Everything below is deliberately varied so each feature gets exercised.
; =====================================================================
# '#' starts a comment too.

; ---- Global section: keys that appear before the first [section] ----
app_name = INIRW Demo
version  = 1.2.0
build = release

; ---- Plain keys, inline comments, typed values ----
[server]
host    = 127.0.0.1          ; inline comment (stripped when reading)
port    = 9090
debug   = true
timeout = 2.5                # '#' works for inline comments as well
motd    = Hello\; world      ; \; keeps the semicolon inside the value
workers = 4

; ---- Escapes and unusual-but-legal syntax ----
[database]
name = main
user = admin
empty_value =
flag_without_equals = now_has_a_value

[paths]
home = C:\\Users\\demo       ; Windows paths need doubled backslashes
temp = C:\\Temp

[ spaced section ]
    indented key    =    lots of   space

[special\]chars]

; ---- Duplicates and ordering ----
[duplicates]
color = blue

[list]
item1 = apple!
item2 = banana!
item3 = cherry!

; ---- A section the example will delete ----
[cache]
size = 256
ttl = 60
